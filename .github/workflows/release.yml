name: Publish Python 🐍 distribution 📦 to PyPI

on:
  workflow_dispatch:

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.2
        with:
          persist-credentials: false
      - name: Pin commit date so build-project derives the upstream SOURCE_DATE_EPOCH
        run: |
          git config user.email "ci@example.com"
          git config user.name "CI"
          GIT_COMMITTER_DATE="@1770250272 +0000" git commit --amend --no-edit --date="@1770250272 +0000"
      - name: Build a binary wheel and a source tarball
        run: ./build-project/build-project.py
      - name: Store the distribution packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: python-package-distributions
          path: dist/
